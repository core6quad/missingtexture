<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Generate Source Engine missing-texture checkerboard PNGs in your browser." />
  <meta name="theme-color" content="#0e1013" />
  <title>Missing Texture</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <span class="mark" aria-hidden="true"></span>
      <div class="titles">
        <h1>Missing Texture</h1>
        <p>Classic debug/missingtexture is back</p>
      </div>
    </header>

    <section class="card" aria-label="Settings">
      <div class="row">
        <label class="field">
          <span>Width</span>
          <input type="number" id="width" inputmode="numeric" min="8" max="8192" step="1" value="512" />
        </label>
        <label class="field">
          <span>Height</span>
          <input type="number" id="height" inputmode="numeric" min="8" max="8192" step="1" value="512" />
        </label>
      </div>

      <label class="field">
        <span>Cell size</span>
        <input type="number" id="cell" inputmode="numeric" min="1" max="8192" step="1" value="32" />
      </label>

      <div class="row">
        <div class="field">
          <span>Color A</span>
          <div class="pick">
            <input type="color" id="colorA" value="#202020" aria-label="Color A" />
            <input type="text" id="colorAHex" class="hex" value="#202020" spellcheck="false" autocomplete="off" aria-label="Color A hex" />
          </div>
        </div>
        <div class="field">
          <span>Color B</span>
          <div class="pick">
            <input type="color" id="colorB" value="#ff00ff" aria-label="Color B" />
            <input type="text" id="colorBHex" class="hex" value="#FF00FF" spellcheck="false" autocomplete="off" aria-label="Color B hex" />
          </div>
        </div>
      </div>

      <div class="toggles">
        <label class="check">
          <input type="checkbox" id="swap" />
          <span>B in top-left</span>
        </label>
        <label class="check">
          <input type="checkbox" id="redx" />
          <span>Red X</span>
        </label>
      </div>

      <div class="secondary">
        <button class="ghost" id="copy" type="button">Copy</button>
        <button class="ghost" id="reset" type="button">Reset</button>
      </div>
    </section>

    <section class="card preview" aria-label="Preview">
      <div class="preview-head">
        <span class="label">Preview</span>
        <span class="stats"><span id="readout"></span><span id="sizeLabel"></span></span>
      </div>
      <div class="canvas-wrap">
        <canvas id="canvas" width="512" height="512" aria-label="Checkerboard preview"></canvas>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <div class="actions">
      <button class="primary" id="download" type="button">Download PNG</button>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
